version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: transporte_uta_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MiPasswordSeguro123*  # Contraseña maestra de SQL Server en Docker
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always

volumes:
  mssql_data: