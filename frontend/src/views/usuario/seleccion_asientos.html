<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegir asiento | Transporte</title>
  <link rel="stylesheet" href="../../assets/usuario.css">
  <script src="../../js/usuario_asientos.js" defer></script>
</head>
<body>
  <div class="usuario-shell">
    <header class="usuario-header">
      <a class="usuario-brand" href="catalogo_viajes.html">
        <span class="usuario-brand-mark" aria-hidden="true">↗</span>
        <span><span class="usuario-brand-name">Transporte</span><span class="usuario-brand-caption">Viaja seguro y a tu ritmo</span></span>
      </a>
      <nav class="usuario-navigation" aria-label="Navegación de reserva">
        <a href="catalogo_viajes.html">Nueva búsqueda</a>
        <a href="../auth/login.html">Volver al inicio</a>
      </nav>
    </header>
    <main class="usuario-main">
      <p class="usuario-eyebrow">Selecciona tu lugar</p>
      <h1 class="usuario-title">Mapa de asientos</h1>
      <p id="tripSummary" class="usuario-subtitle">Cargando información del bus...</p>
      <section class="usuario-card">
        <div class="seat-legend" aria-label="Estados de los asientos">
          <span class="legend-item"><span class="legend-color libre"></span>Libre</span>
          <span class="legend-item"><span class="legend-color reservado"></span>Reservado</span>
          <span class="legend-item"><span class="legend-color ocupado"></span>Ocupado</span>
        </div>
        <div id="floorTabs" class="floor-tabs" role="tablist"></div>
        <div id="seatGrid" class="seat-grid" aria-live="polite"></div>
        <p id="seatStatus" class="usuario-status" role="status"></p>
      </section>
      <section id="reservationPanel" class="usuario-card reservation-panel" aria-labelledby="reservationTitle">
        <h2 id="reservationTitle">Confirmar reserva</h2>
        <p id="reservationSummary" class="reservation-summary"></p>
        <form id="reservationForm">
          <div class="reservation-grid">
            <div class="usuario-field"><label for="cedula">Cédula del pasajero</label><input id="cedula" name="cedula" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" minlength="10" required placeholder="Ej. 1712345678"></div>
            <div class="usuario-field"><label for="metodoPago">Método de pago</label><select id="metodoPago" name="metodoPago" required><option value="">Selecciona una opción</option><option value="EFECTIVO">Efectivo</option><option value="TRANSFERENCIA">Transferencia</option></select></div>
          </div>
          <div id="comprobanteField" class="usuario-field comprobante-field" hidden><label for="comprobante">Comprobante de transferencia (JPG, PNG o PDF, máximo 5 MB)</label><input id="comprobante" name="comprobante" type="file" accept=".jpg,.jpeg,.png,.pdf"></div>
          <p id="paymentHelp" class="usuario-status">La cédula identifica al pasajero y se valida antes de registrar la reserva.</p>
          <div class="reservation-actions">
            <button class="usuario-button" type="submit">Crear reserva pendiente</button>
            <button id="cancelReservation" class="usuario-button usuario-button-secondary" type="button">Cancelar</button>
          </div>
        </form>
        <div id="qrResult" class="qr-result" hidden></div>
      </section>
    </main>
  </div>
</body>
</html>
