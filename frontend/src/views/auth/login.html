<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Transporte Interprovincial</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Sistema de Transporte</h2>
            <p>Inicie sesión con sus credenciales</p>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" required placeholder="ejemplo@transporte.ec">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="********">
            </div>

            <button type="submit" class="btn-login">Ingresar</button>
            <div id="mensajeError" class="error-message"></div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
